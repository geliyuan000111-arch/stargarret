
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Note Flow</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f9fafb;
    }
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f1f1;
    }
    ::-webkit-scrollbar-thumb {
      background: #e2e8f0;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #cbd5e1;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    
    @keyframes flash {
      0% { background-color: rgba(253, 224, 71, 0.5); transform: scale(1.02); }
      50% { background-color: rgba(253, 224, 71, 0.2); transform: scale(1); }
      100% { background-color: transparent; transform: scale(1); }
    }
    .highlight-flash {
      animation: flash 2s ease-out forwards;
    }

    @keyframes double-flash {
      0%, 40%, 80% { opacity: 1; transform: scale(1); background-color: transparent; }
      20%, 60% { opacity: 0.5; transform: scale(1.05); background-color: rgba(239, 68, 68, 0.2); }
      100% { opacity: 0; transform: scale(0.95); }
    }
    .egg-delete-flash {
      animation: double-flash 1.5s ease-in-out forwards;
    }
  </style>
